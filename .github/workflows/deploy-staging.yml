name: Déploiement préproduction (staging)

# Se déclenche à CHAQUE push sur la branche staging.
on:
  push:
    branches: [staging]

# Empêche deux déploiements de staging de tourner en même temps
# (le plus récent annule le précédent).
concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # Garde-fou : tant que les secrets ne sont pas configurés, on n'essaie pas
  # de déployer (le job ci-dessous sera "ignoré" au lieu d'échouer en rouge).
  gate:
    name: Vérifier la configuration des secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Secrets Shopify absents → déploiement ignoré (voir README, section token)."
          fi

  deploy-staging:
    name: Theme Check + push vers le thème de préproduction
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      # 🔐 Renseignés dans les "Secrets" GitHub — JAMAIS dans le code.
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
      # Désactive toutes les questions interactives (obligatoire en CI).
      SHOPIFY_FLAG_FORCE: "1"
      # Nom du thème de préproduction (réutilisé à chaque déploiement).
      STAGING_THEME_NAME: "🧪 STAGING — ne pas publier"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Shopify CLI
        run: npm install -g @shopify/cli@latest

      # Si Theme Check trouve des ERREURS, le job échoue ici et le push
      # ci-dessous n'est jamais exécuté → rien n'est déployé.
      - name: Theme Check (bloque le déploiement en cas d'erreur)
        run: shopify theme check

      - name: Pousser vers le thème de préproduction (non publié)
        run: |
          set -euo pipefail
          # On cherche un thème non publié qui porte déjà notre nom de staging.
          THEME_ID=$(shopify theme list --json --role unpublished --name "$STAGING_THEME_NAME" \
            | jq -r '(if type=="array" then . else (.themes // []) end) | map(.id) | first // empty')

          if [ -z "$THEME_ID" ]; then
            echo "➕ Aucun thème de préproduction trouvé → création de « $STAGING_THEME_NAME »"
            shopify theme push --unpublished --theme "$STAGING_THEME_NAME" --json
          else
            echo "♻️  Thème de préproduction existant → mise à jour (#$THEME_ID)"
            shopify theme push --theme "$THEME_ID" --nodelete --json
          fi
