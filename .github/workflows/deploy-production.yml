name: Déploiement production (main)

# Se déclenche à CHAQUE arrivée de code sur main (donc à chaque merge de PR).
on:
  push:
    branches: [main]

# Un seul déploiement prod à la fois. On n'annule PAS un déploiement en cours
# (cancel-in-progress: false) pour ne jamais laisser la prod à moitié déployée.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Garde-fou : tant que les secrets ne sont pas configurés, on n'essaie pas
  # de déployer (le job ci-dessous sera "ignoré" au lieu d'échouer en rouge).
  gate:
    name: Vérifier la configuration des secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Secrets Shopify absents → déploiement ignoré (voir README, section token)."
          fi

  deploy-production:
    name: Theme Check + déploiement vers le thème publié
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      # 🔐 Renseignés dans les "Secrets" GitHub — JAMAIS dans le code.
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_FLAG_FORCE: "1"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ requis par Shopify CLI 4.x (utilise module.enableCompileCache).
          node-version: 22

      - name: Installer Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Theme Check (bloque le déploiement en cas d'erreur)
        run: shopify theme check

      # --live          : cible le thème actuellement PUBLIÉ (la prod)
      # --allow-live     : autorise l'écriture sur un thème publié
      # --nodelete       : ne supprime pas côté Shopify des fichiers absents en local
      # --ignore ...     : NE touche PAS aux contenus/réglages gérés dans l'éditeur
      #                    Shopify (branding, page d'accueil, header/footer...).
      #                    → tes personnalisations en ligne sont préservées.
      - name: Déployer vers le thème PUBLIÉ (production)
        run: |
          shopify theme push --live --allow-live --nodelete \
            --ignore "config/settings_data.json" \
            --ignore "templates/*.json" \
            --ignore "templates/**/*.json" \
            --ignore "sections/*.json" \
            --json
